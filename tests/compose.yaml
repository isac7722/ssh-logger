name: ssh-logger-test
services:
  server:
    image: ssh-logger-server:latest
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      PUBLIC_ORIGIN: http://localhost:18080
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - admin_password
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 10
secrets:
  admin_password:
    file: ../.secrets/admin_password
volumes:
  data:
