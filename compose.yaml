name: ssh-logger
services:
  server:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      DB_PATH: /data/sshlogger.db
      WEB_DIR: /app/web
    secrets:
      - admin_password
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  admin_password:
    file: ./.secrets/admin_password
volumes:
  data:
